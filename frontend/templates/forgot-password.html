<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Smart Expense Tracker AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>🔐 Forgot Password</h1>

            <p>
                Enter your registered email address to reset your password.
            </p>

            {% if error %}
                <div class="flash-error">
                    {{ error }}
                </div>
            {% endif %}

            <form
                action="{{ url_for('forgot') }}"
                method="POST"
            >

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >

                <button type="submit">
                    Send OTP
                </button>

            </form>

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
