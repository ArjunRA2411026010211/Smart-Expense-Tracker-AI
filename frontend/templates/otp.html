<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🔐 Verify OTP</h1>

        <p>
            A 6-digit OTP has been sent to your registered email address.
        </p>

        {% if success %}
            <div class="flash-success">
                {{ success }}
            </div>
        {% endif %}

        {% if error %}
            <div class="flash-error">
                {{ error }}
            </div>
        {% endif %}

        <form
            action="{{ url_for('otp') }}"
            method="POST"
        >

            <input
                type="text"
                name="otp"
                placeholder="Enter 6 Digit OTP"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

        <p style="margin-top: 18px;">
            OTP is valid for 5 minutes.
        </p>

        <p>
            Didn't receive OTP?
            <a href="{{ url_for('resend_otp') }}">
                🔄 Resend OTP
            </a>
        </p>

        <a href="{{ url_for('forgot') }}">
            ← Change Email
        </a>

    </div>

</div>

</body>

</html>
