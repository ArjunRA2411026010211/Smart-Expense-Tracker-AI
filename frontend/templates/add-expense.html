<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">

<div class="login-box">

<h2>Add Expense</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

        {% for category, message in messages %}

            {% if category == "error" %}
                <div class="flash-error">
                    {{ message }}
                </div>
            {% else %}
                <div class="flash-success">
                    {{ message }}
                </div>
            {% endif %}

        {% endfor %}

    {% endif %}
{% endwith %}

<form action="/add_expense" method="POST">

<input
type="text"
name="category"
placeholder="Category (Food, Petrol...)"
required>

<input
type="number"
step="0.01"
name="amount"
placeholder="Amount"
required>

<input
type="text"
name="description"
placeholder="Description">

<input
type="date"
name="expense_date"
required>

<button type="submit">
Add Expense
</button>

</form>

<br>

<a href="{{ url_for('dashboard') }}">
⬅ Back to Dashboard
</a>

</div>

</div>

</body>
</html>
